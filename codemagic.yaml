
workflows:
  beat-labz-android-debug:
    name: BEAT LABZ Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22.14.0
      java: 17

      vars:
        VITE_API_BASE_URL: "https://ais-pre-6cb7rhe3koo64c63leez2e-618046858354.asia-east1.run.app"

    scripts:

      - name: Check Android project
        script: |
          echo "Checking BEAT LABZ Android project..."

          test -f package.json
          test -f capacitor.config.ts
          test -f android/settings.gradle
          test -f android/gradlew
          test -f android/app/build.gradle

          echo "Android project files verified."

      - name: Install Node dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Verify TypeScript
        script: |
          npm run lint

      - name: Build BEAT LABZ web application
        script: |
          npm run build

      - name: Synchronize Capacitor Android
        script: |
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK output
        script: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "BEAT LABZ APK successfully generated!"

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk


